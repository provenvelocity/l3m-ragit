name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:launcher-failure
      - name: Test managed npm fallback
        run: |
          RAGIT_DOCKER_COMMAND=ragit-test-missing-docker \
            RAGIT_NATIVE_COMMAND=ragit-test-missing-native \
            CBM_TEST_BINARY="$(command -v node)" \
            CBM_TEST_LAUNCHER="$PWD/dist/backend-launcher.cjs" \
            npm run test:backend
      - name: Test Docker backend
        run: |
          npm run docker:build
          RAGIT_BACKEND_MODE=docker \
            CBM_TEST_BINARY="$(command -v node)" \
            CBM_TEST_LAUNCHER="$PWD/dist/backend-launcher.cjs" \
            npm run test:backend
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: ragit-vsix
          path: ragit-*.vsix
