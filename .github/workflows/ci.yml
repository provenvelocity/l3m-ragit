name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Test codebase-memory-mcp integration
        run: |
          curl -fsSLO https://github.com/DeusData/codebase-memory-mcp/releases/download/v0.11.0/codebase-memory-mcp-linux-amd64-portable.tar.gz
          echo "1f9e8293eb2bc5c05cfa27a7e8fc033da6d729ffad525ccfcdaa3fd606306683  codebase-memory-mcp-linux-amd64-portable.tar.gz" | sha256sum --check
          mkdir cbm
          tar -xzf codebase-memory-mcp-linux-amd64-portable.tar.gz -C cbm
          CBM_TEST_BINARY="$PWD/cbm/codebase-memory-mcp" npm run test:backend
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: l3m-ragit-vsix
          path: l3m-ragit-*.vsix
